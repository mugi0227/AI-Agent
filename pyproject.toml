[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-assistant"
version = "0.3.0"
description = "Local-first Windows work assistant with Amazon Bedrock Responses"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sigv4 = ["boto3>=1.35,<2"]
pdf = ["pypdf>=5,<7"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
work-assistant = "work_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["work_assistant*"]
